name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'yt-dlp channel (stable or nightly)'
        required: false
        default: stable
        type: choice
        options: [stable, nightly]

jobs:
  build-macos:
    name: build macOS app
    runs-on: macos-latest
    env:
      SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
    outputs:
      sparkle_signature: ${{ steps.sign.outputs.signature }}
      sparkle_length: ${{ steps.sign.outputs.length }}
      app_version: ${{ steps.sign.outputs.version }}
      build_number: ${{ steps.sign.outputs.build }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Validate release readiness
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          python3 scripts/release/check_release_readiness.py \
            "${{ github.ref_name }}" \
            --tag-ref "$GITHUB_SHA" \
            --main-ref FETCH_HEAD \
            --skip-appcast-check

      - name: Build release app
        run: |
          zsh scripts/build/swift/build.sh \
            --release \
            --channel "${{ github.event.inputs.channel || 'stable' }}"

      - name: Sign ZIP with Sparkle Ed25519
        id: sign
        if: env.SPARKLE_ED25519_KEY != ''
        env:
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
        run: |
          # Find sign_update from Sparkle SPM artifacts
          SIGN_UPDATE=$(find tmp/swift-build/DerivedData -name sign_update -path '*/Sparkle/bin/*' -type f | head -1)
          if [[ -z "$SIGN_UPDATE" ]]; then
            echo "::error::sign_update not found in DerivedData"
            exit 1
          fi
          chmod +x "$SIGN_UPDATE"

          # Sign the ZIP — key piped via stdin, never touches disk
          SIGN_OUTPUT=$(echo "$SPARKLE_ED25519_KEY" | "$SIGN_UPDATE" --ed-key-file - swift/dist/YTTool.zip)
          echo "sign_update output: $SIGN_OUTPUT"

          # Parse: sparkle:edSignature="..." length="..."
          SIGNATURE=$(echo "$SIGN_OUTPUT" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)
          LENGTH=$(echo "$SIGN_OUTPUT" | grep -o 'length="[^"]*"' | cut -d'"' -f2)

          if [[ -z "$SIGNATURE" || -z "$LENGTH" ]]; then
            echo "::error::Failed to parse sign_update output"
            exit 1
          fi

          # Read version from built app
          VERSION=$(defaults read "$(pwd)/swift/dist/YTTool.app/Contents/Info.plist" CFBundleShortVersionString)
          BUILD=$(defaults read "$(pwd)/swift/dist/YTTool.app/Contents/Info.plist" CFBundleVersion)

          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "length=$LENGTH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Signed: v$VERSION (build $BUILD), length=$LENGTH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yt-tool-macOS
          path: |
            swift/dist/YTTool.zip
            swift/dist/YTTool.dmg

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: yt-tool-macOS
          path: dist/

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          python3 scripts/release/extract_release_notes.py "$TAG" --out release_notes.md

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file release_notes.md --verify-tag
          else
            gh release edit "$TAG" --notes-file release_notes.md
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" dist/YTTool.zip dist/YTTool.dmg --clobber

      - name: Update appcast.xml and create PR
        if: needs.build-macos.outputs.sparkle_signature != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.build-macos.outputs.app_version }}"
          BUILD="${{ needs.build-macos.outputs.build_number }}"
          SIGNATURE="${{ needs.build-macos.outputs.sparkle_signature }}"
          LENGTH="${{ needs.build-macos.outputs.sparkle_length }}"

          echo "Updating appcast: v$VERSION build=$BUILD length=$LENGTH"

          python3 scripts/release/update_appcast.py \
            --version "$VERSION" \
            --build "$BUILD" \
            --signature "$SIGNATURE" \
            --length "$LENGTH"

          # Check if appcast actually changed
          if git diff --quiet docs/appcast.xml; then
            echo "appcast.xml already up to date, skipping PR"
            exit 0
          fi

          BRANCH="chore/appcast-v${VERSION}-signature"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/appcast.xml
          git commit -m "chore: update appcast v${VERSION} Ed25519 signature from CI build"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: appcast v${VERSION} Ed25519 signature" \
            --body "Auto-generated by release workflow. Updates \`docs/appcast.xml\` with the Ed25519 signature from the CI-built ZIP.

          - Version: v${VERSION} (build ${BUILD})
          - Length: ${LENGTH} bytes
          - Signature: \`${SIGNATURE:0:20}...\`

          Merge to activate Sparkle auto-update for this release." \
            --base main \
            --head "$BRANCH"
