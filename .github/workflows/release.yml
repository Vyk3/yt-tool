name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'yt-dlp channel (stable or nightly)'
        required: false
        default: stable
        type: choice
        options: [stable, nightly]

jobs:
  build-macos:
    name: build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build release app
        run: |
          zsh scripts/build/swift/build.sh \
            --release \
            --channel "${{ github.event.inputs.channel || 'stable' }}" \
            --skip-test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-tool-macOS
          path: swift/dist/YTTool.zip

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: yt-tool-macOS
          path: dist/

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG" --verify-tag
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" dist/YTTool.zip --clobber
