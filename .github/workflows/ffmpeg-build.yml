name: Build minimal ffmpeg
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Build revision, e.g. r1"
        required: true
        type: string

concurrency:
  group: ffmpeg-build-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate inputs and assert main
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "FATAL: must run from main branch" >&2; exit 1
          fi
          if [[ ! "$REVISION" =~ ^r[1-9][0-9]*$ ]]; then
            echo "FATAL: revision must match ^r[1-9][0-9]*$" >&2; exit 1
          fi
          TAG="ffmpeg-8.1.1-minimal-${REVISION}"
          if gh release view "$TAG" &>/dev/null; then
            echo "FATAL: release $TAG already exists" >&2; exit 1
          fi
        env:
          REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert toolchain
        run: |
          echo "Runner image: ${ImageVersion:-unknown}"
          xcodebuild -version
          /usr/bin/clang --version
          xcrun --show-sdk-version

      - name: Install GPG
        run: command -v gpg &>/dev/null || brew install gnupg

      - name: Build
        run: bash scripts/build/ffmpeg/build_minimal.sh
        env:
          BUILD_REVISION: ${{ inputs.revision }}
          OUTPUT_DIR: ${{ runner.temp }}/ffmpeg-output

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-build-output
          path: ${{ runner.temp }}/ffmpeg-output/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: dependency-release
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ffmpeg-build-output
          path: output/

      - name: Create draft release
        run: |
          VERSION="8.1.1"
          TAG="ffmpeg-${VERSION}-minimal-${REVISION}"

          gh release create "$TAG" \
            "output/ffmpeg-${VERSION}-minimal-${REVISION}.zip" \
            "output/SHA256SUMS" \
            "output/ffmpeg-${VERSION}.tar.xz" \
            "output/lame-3.100.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "output/RELEASE_NOTES.md" \
            --draft
        env:
          REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Readback verify
        run: |
          VERSION="8.1.1"
          TAG="ffmpeg-${VERSION}-minimal-${REVISION}"
          READBACK="$(mktemp -d)"

          gh release download "$TAG" -D "$READBACK"

          diff "output/SHA256SUMS" "$READBACK/SHA256SUMS" || \
            { echo "FATAL: release SHA256SUMS differs from build" >&2; exit 1; }

          while IFS='=' read -r key val; do
            case "$key" in
              archive_sha256)
                ACTUAL="$(shasum -a 256 "$READBACK/ffmpeg-${VERSION}-minimal-${REVISION}.zip" | cut -d' ' -f1)"
                [[ "$ACTUAL" == "$val" ]] || { echo "FATAL: archive SHA mismatch" >&2; exit 1; }
                ;;
              ffmpeg_member_sha256)
                ACTUAL="$(unzip -p "$READBACK/ffmpeg-${VERSION}-minimal-${REVISION}.zip" ffmpeg | shasum -a 256 | cut -d' ' -f1)"
                [[ "$ACTUAL" == "$val" ]] || { echo "FATAL: ffmpeg member SHA mismatch" >&2; exit 1; }
                ;;
              ffprobe_member_sha256)
                ACTUAL="$(unzip -p "$READBACK/ffmpeg-${VERSION}-minimal-${REVISION}.zip" ffprobe | shasum -a 256 | cut -d' ' -f1)"
                [[ "$ACTUAL" == "$val" ]] || { echo "FATAL: ffprobe member SHA mismatch" >&2; exit 1; }
                ;;
              ffmpeg_source_sha256)
                ACTUAL="$(shasum -a 256 "$READBACK/ffmpeg-${VERSION}.tar.xz" | cut -d' ' -f1)"
                [[ "$ACTUAL" == "$val" ]] || { echo "FATAL: ffmpeg source SHA mismatch" >&2; exit 1; }
                ;;
              lame_source_sha256)
                ACTUAL="$(shasum -a 256 "$READBACK/lame-3.100.tar.gz" | cut -d' ' -f1)"
                [[ "$ACTUAL" == "$val" ]] || { echo "FATAL: lame source SHA mismatch" >&2; exit 1; }
                ;;
            esac
          done < "$READBACK/SHA256SUMS"

          echo "Readback verify passed: all 5 checksums match"
        env:
          REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: |
          TAG="ffmpeg-8.1.1-minimal-${REVISION}"
          gh release edit "$TAG" --draft=false --prerelease
        env:
          REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
