name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  swift-test:
    name: swift test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Swift tests
        run: swift test --disable-sandbox --package-path swift

  swift-build:
    name: swift build (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build YTTool (Debug)
        run: |
          xcodebuild \
            -project swift/YTTool.xcodeproj \
            -scheme YTTool \
            -configuration Debug \
            -derivedDataPath tmp/xcode-derived-data \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build
