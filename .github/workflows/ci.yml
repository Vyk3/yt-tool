name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  swift-test:
    name: swift test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Run Swift tests
        run: swift test --disable-sandbox --package-path swift

  swift-build:
    name: swift build (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Build YTTool (Debug)
        run: |
          xcodebuild \
            -project swift/YTTool.xcodeproj \
            -scheme YTTool \
            -configuration Debug \
            -derivedDataPath tmp/xcode-derived-data \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

  option-contract-check:
    name: option contract (${{ matrix.channel }})
    runs-on: macos-15
    strategy:
      matrix:
        channel: [stable, nightly]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download and verify yt-dlp
        run: bash scripts/build/ffmpeg/download_pinned_ytdlp.sh "${{ matrix.channel }}" /tmp/ytdlp-bin

      - name: Capture yt-dlp help output
        run: /tmp/ytdlp-bin/yt-dlp --help > /tmp/ytdlp-help.txt

      - name: Run option contract test
        run: bash scripts/test/swift_test.sh --filter ExtraOptionContractTests
        env:
          YT_DLP_HELP_FILE: /tmp/ytdlp-help.txt
          REQUIRE_YTDLP_OPTION_CONTRACT: "1"

  option-contract-gate:
    needs: [option-contract-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.option-contract-check.result }}" != "success" ]]; then
            echo "FATAL: option contract check failed" >&2; exit 1
          fi

  release-build-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE...$HEAD" | \
             grep -qE '^(swift/|scripts/build/|\.github/workflows/ci\.yml)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

  release-build-check:
    name: release build (${{ matrix.channel }})
    needs: [release-build-changes]
    if: needs.release-build-changes.outputs.needed == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    strategy:
      matrix:
        channel: [stable, nightly]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Release build
        run: |
          zsh scripts/build/swift/build.sh \
            --release --channel ${{ matrix.channel }} \
            --output /tmp/yt-tool-${{ matrix.channel }}

      - name: Verify licenses in App bundle
        run: |
          APP="/tmp/yt-tool-${{ matrix.channel }}/YTTool.app"
          LICENSES="$APP/Contents/Resources/Licenses"
          for f in LICENSE_LGPL.txt LICENSE_LAME.txt NOTICE_FFMPEG.txt; do
            [[ -s "$LICENSES/$f" ]] || \
              { echo "FATAL: $f missing from App bundle" >&2; exit 1; }
          done
          grep -qi "GNU Lesser General Public License" "$LICENSES/LICENSE_LGPL.txt" || \
            { echo "FATAL: LICENSE_LGPL.txt missing LGPL identifier" >&2; exit 1; }
          grep -q "LAME" "$LICENSES/LICENSE_LAME.txt" || \
            { echo "FATAL: LICENSE_LAME.txt missing LAME attribution" >&2; exit 1; }
          grep -q "GNU LIBRARY GENERAL PUBLIC LICENSE" "$LICENSES/LICENSE_LAME.txt" || \
            { echo "FATAL: LICENSE_LAME.txt missing verbatim license title" >&2; exit 1; }
          grep -q "you may modify" "$LICENSES/NOTICE_FFMPEG.txt" || \
            { echo "FATAL: NOTICE_FFMPEG.txt missing replacement notice" >&2; exit 1; }

      - name: Verify codesign
        run: |
          codesign --verify --deep --strict \
            "/tmp/yt-tool-${{ matrix.channel }}/YTTool.app"

  release-build-gate:
    needs: [release-build-changes, release-build-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          needed="${{ needs.release-build-changes.outputs.needed }}"
          result="${{ needs.release-build-check.result }}"
          if [[ "$needed" != "true" ]]; then
            echo "Release build skipped — no relevant paths changed"
            exit 0
          fi
          if [[ "$result" != "success" ]]; then
            echo "FATAL: release build check failed" >&2; exit 1
          fi
