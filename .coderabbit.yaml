language: "zh-CN"

reviews:
  profile: "chill"

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: true
  estimate_code_review_effort: true
  collapse_walkthrough: true
  review_status: true

  path_filters:
    - "!**/*.pbxproj"
    - "!**/*.xcworkspacedata"
    - "!**/*.xcscheme"
    - "!**/Package.resolved"
    - "!**/.gitkeep"
    - "!docs/appcast.xml"
    - "!LICENSE*"
    - "!scripts/build/ffmpeg/licenses/**"

chat:
  auto_reply: true
